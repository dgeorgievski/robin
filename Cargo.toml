[package]
name = "robin-did-resolver-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Experimental method-independent DID resolver evidence spike for Robin"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
async-trait = "0.1.89"
didwebvh-rs = { version = "=0.6.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0-rc.2"
thiserror = "2.0.17"
wasm-bindgen = { version = "0.2.104", optional = true }
wasm-bindgen-futures = { version = "0.4.54", optional = true }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
